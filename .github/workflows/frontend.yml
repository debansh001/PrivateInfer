name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Build Next.js
      run: npm run build
      env:
        # We don't need a real DB URL just to build the static pages/types, 
        # but Next.js might complain if it's referenced in global scopes without being set.
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
